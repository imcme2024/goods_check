<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="物品チェック" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#2C4A47" />
<title>物品チェック</title>
<style>
  [hidden]{display:none !important;}
  :root{
    --bg:#F1F4F1;
    --surface:#FFFFFF;
    --surface-alt:#E8EEEA;
    --ink:#1E2A27;
    --ink-soft:#4F5D58;
    --line:#D6E0DA;
    --primary:#2C4A47;
    --primary-soft:#3F615D;
    --accent:#3E7D62;
    --accent-soft:#E4F0E9;
    --warn:#B98A1F;
    --warn-soft:#FBF0DA;
    --danger:#B3402A;
    --danger-soft:#F8E4DE;
    --radius:10px;
    --radius-sm:6px;
    --photo-w:112px;
    --card-h:150px;
  }
  @media(min-width:700px){:root{--photo-w:128px;--card-h:164px;}}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overscroll-behavior-x:none;}
  input,textarea,select{overscroll-behavior-x:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Meiryo,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--dock-h,0px) + 16px);
  }
  button,input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--primary-soft);outline-offset:2px;}

  /* Header */
  .app-header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:14px 16px 10px;}
  .app-header__top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .app-title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;margin:0;letter-spacing:.01em;}
  .app-title__mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.18);
    font-size:13px;font-weight:700;flex-shrink:0;
  }
  .app-version{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;letter-spacing:0;}
  body[data-room="cath"]{--primary:#23466F;--primary-soft:#3A6697;--accent:#2F6FA8;--accent-soft:#E2EDF8;--bg:#F0F3F7;--surface-alt:#E6ECF3;--line:#D3DCE8;}
  .app-title-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .room-switch{display:flex;gap:2px;background:rgba(255,255,255,.16);padding:2px;border-radius:999px;}
  .room-btn{border:none;background:transparent;color:rgba(255,255,255,.8);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .room-btn.is-active{background:#fff;color:var(--primary);}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:3px;border-radius:999px;}
  .tab{border:none;background:transparent;color:rgba(255,255,255,.75);padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;}
  .tab.is-active{background:#fff;color:var(--primary);font-weight:600;}
  .app-header__meta{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .meta-summary{
    display:none;align-items:center;gap:8px;width:100%;margin-top:8px;padding:6px 12px;
    border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(255,255,255,.1);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
  }
  .meta-summary__edit{margin-left:auto;font-size:12px;font-weight:400;color:rgba(255,255,255,.75);}
  .field-inline{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.85);}
  .field-inline input{
    border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;
    border-radius:var(--radius-sm);padding:6px 8px;font-size:14px;
  }
  .field-inline input::placeholder{color:rgba(255,255,255,.55);}
  .field-inline input[type=date]{color-scheme:dark;}
  .field-inline select{
    border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;
    border-radius:var(--radius-sm);padding:6px 8px;font-size:16px;min-width:140px;
  }
  .field-inline select option{color:#1E2A27;background:#fff;}
  .field-inline select:disabled{opacity:.6;}

  main{max-width:720px;margin:0 auto;padding:14px 12px 24px;}
  .view[hidden]{display:none;}

  .search-row{
    display:block;width:100%;padding:9px 12px;margin-bottom:12px;
    border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:14px;background:var(--surface);
  }

  /* Check mode bar */
  .check-mode-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
  .check-mode-bar__info{font-size:13px;color:var(--ink-soft);}
  .check-mode-bar__info strong{color:var(--primary);font-weight:700;}

  /* Stack mode */
  .stack-area{position:relative;isolation:isolate;height:calc(var(--card-h) + 64px);margin-bottom:8px;}
  .stack-card{position:absolute;left:0;right:0;top:0;border-radius:var(--radius);transform-origin:50% 100%;transition:transform .55s cubic-bezier(.34,1.45,.5,1),opacity .35s ease;}
  .stack-card.is-leaving{transition:transform .5s cubic-bezier(.45,0,.9,.5),opacity .45s ease-in;}
  .stack-card__shade{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .4s ease;}
  .stack-card__result{
    position:absolute;top:0;right:0;bottom:0;width:46%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;text-align:center;
    animation:stackResultPop .2s ease-out both;
  }
  .stack-card__result-val{font-size:38px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;}
  .stack-card__result-state{font-size:18px;font-weight:700;}
  .stack-card__result.is-ok{background:var(--accent-soft);color:#245943;}
  .stack-card__result.is-order{background:var(--danger-soft);color:#7A2A1C;}
  .stack-card__result.is-check{background:var(--warn-soft);color:#7A5A12;}
  .stack-card__inner.res-ok{border-left-color:var(--accent);}
  .stack-card__inner.res-order{border-left-color:var(--danger);}
  .stack-card__inner.res-check{border-left-color:var(--warn);}
  @keyframes stackResultPop{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
  .stack-card__inner{
    position:relative;display:flex;align-items:center;gap:14px;height:var(--card-h);padding:0 14px 0 12px;
    background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(30,42,39,.12);
  }
  .stack-card__inner.is-front{border-left-color:var(--accent);}
  .stack-card__photo{width:var(--photo-w);height:var(--photo-w);flex-shrink:0;border-radius:8px;background:var(--surface-alt);overflow:hidden;}
  .stack-card__photo img{width:100%;height:100%;object-fit:contain;display:block;}
  .stack-card__body{flex:1;min-width:0;}
  .stack-card__name{font-size:25px;line-height:1.2;font-weight:700;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;word-break:break-all;}
  .stack-card__spec{font-size:17px;line-height:1.4;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stack-card__target{font-size:20px;line-height:1.4;font-weight:600;color:var(--ink);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stack-card__target .tag{font-size:12px;font-weight:600;vertical-align:middle;}
  .stack-card__prev{font-size:18px;line-height:1.4;color:var(--ink-soft);margin-top:2px;}
  .stack-empty{text-align:center;padding:34px 16px;color:var(--ink-soft);}

  /* Check list (list mode) */
  .empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty-state p{margin:0 0 12px;}

  .location-section{margin-bottom:18px;}
  .location-section__head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:6px 2px;border-bottom:2px solid var(--primary);margin-bottom:6px;gap:8px;
  }
  .location-section__title{font-size:15px;font-weight:700;color:var(--primary);}
  .location-section__progress{font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  .item-row{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border-left:4px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 10px;margin-bottom:6px;transition:border-color .15s ease;
  }
  .item-row.is-ok{border-left-color:var(--accent);}
  .item-row.is-order{border-left-color:var(--danger);}
  .item-row.is-check{border-left-color:var(--warn);}

  .item-row__photo{width:36px;height:36px;border-radius:6px;background:var(--surface-alt);flex-shrink:0;overflow:hidden;}
  .item-row__photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-row__main{flex:1;min-width:0;}
  .item-row__name{font-size:14px;font-weight:600;color:var(--ink);}
  .item-row__spec{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .item-row__tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--surface-alt);color:var(--ink-soft);}
  .tag--spd{background:var(--warn-soft);color:#7A5A12;}
  .tag--note{background:var(--accent-soft);color:#245943;}
  .tag--clear{border:none;cursor:pointer;}

  .item-row__std{width:76px;flex-shrink:0;font-size:12px;color:var(--ink-soft);text-align:right;}
  .item-row{cursor:pointer;}
  .item-row.is-active{outline:2px solid var(--primary-soft);outline-offset:-2px;background:var(--accent-soft);}
  .item-row__val{
    width:84px;flex-shrink:0;min-height:40px;display:flex;align-items:center;justify-content:flex-end;
    padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);
    font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .item-row__val.is-empty{font-size:12px;font-weight:400;color:var(--ink-soft);}
  .item-row__status-wrap{width:70px;flex-shrink:0;text-align:right;}
  .item-row__status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .item-row__status.is-order{background:var(--danger-soft);color:#7A2A1C;}
  .item-row__status.is-check{background:var(--warn-soft);color:#7A5A12;}
  .item-row__status.is-ok{background:var(--accent-soft);color:#245943;}

  @media(max-width:480px){
    .item-row{flex-wrap:wrap;}
    .item-row__main{width:100%;flex:none;margin-bottom:8px;}
    .item-row__std{width:auto;text-align:left;}
    .item-row__status-wrap{width:auto;text-align:left;margin-left:auto;}
  }

  /* Sticky action bar */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  }
  .dock > *{pointer-events:auto;}
  .keypad{
    display:grid;grid-template-columns:repeat(3,52px);gap:9px;
    width:max-content;margin:0 12px 8px auto;padding:10px 12px;
    background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:30px;
    box-shadow:0 6px 22px rgba(30,42,39,.18);
  }
  .keypad__key{
    width:52px;height:52px;border:none;border-radius:50%;padding:0;
    background:var(--surface-alt);color:var(--primary);font-size:22px;font-weight:600;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer;
    transition:transform .08s ease,background .08s ease;
  }
  .keypad__key:active{background:var(--accent);color:#fff;transform:scale(.92);}
  .keypad__key--sufficient{background:var(--primary);color:#fff;font-size:15px;}
  .keypad__key--sufficient:active{background:var(--accent);}
  .keypad__key--back{background:var(--warn-soft);color:#7A5A12;font-size:14px;}
  .sticky-bar{
    background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.05);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;
    align-items:center;justify-content:space-between;gap:10px;
  }
  .sticky-bar > *{max-width:720px;}
  .item-row__clear{
    width:28px;height:28px;flex-shrink:0;border:none;border-radius:50%;
    background:var(--surface-alt);color:var(--ink-soft);font-size:15px;line-height:1;cursor:pointer;padding:0;
  }
  .item-row__clear.is-hidden{visibility:hidden;}
  .progress-text{font-size:12px;color:var(--ink-soft);}
  .sticky-bar__actions{display:flex;gap:8px;}
  .btn{border:none;border-radius:var(--radius-sm);padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn--ghost{background:var(--surface-alt);color:var(--primary);}
  .btn--accent{background:var(--accent);color:#fff;}
  .btn--primary{background:var(--primary);color:#fff;}
  .btn--danger{background:var(--danger);color:#fff;}

  /* Master */
  .master-block{margin-bottom:26px;}
  .master-block h2{font-size:15px;margin:0 0 10px;color:var(--primary);}
  .master-block__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .location-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .location-chip{
    display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;
  }
  .location-chip button{
    border:none;background:var(--surface-alt);color:var(--ink-soft);width:20px;height:20px;
    border-radius:50%;cursor:pointer;font-size:12px;line-height:1;
  }
  .inline-form{display:flex;gap:8px;}
  .inline-form input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;}
  .inline-form button{padding:8px 14px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-weight:600;cursor:pointer;}

  .item-table{display:flex;flex-direction:column;gap:6px;position:relative;}
  .master-hint{font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;}
  .item-table-row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .item-table-row.is-dragging{
    position:relative;z-index:30;transition:none;opacity:.96;
    box-shadow:0 10px 24px rgba(30,42,39,.28);border-color:var(--accent);background:var(--accent-soft);
  }
  .drop-line{position:absolute;left:0;right:0;height:4px;margin-top:-2px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:40;}
  .item-table-row{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 10px;
  }
  .item-table-row__photo{width:40px;height:40px;border-radius:6px;background:var(--surface-alt);flex-shrink:0;overflow:hidden;}
  .item-table-row__photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-table-row__main{flex:1;min-width:0;}
  .item-table-row__name{font-size:14px;font-weight:600;}
  .item-table-row__sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .item-table-row__actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;cursor:pointer;color:var(--ink);}

  .photo-field{display:flex;align-items:center;gap:10px;}
  .photo-preview{width:56px;height:56px;border-radius:8px;background:var(--surface-alt);flex-shrink:0;overflow:hidden;}
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-field__controls{display:flex;flex-direction:column;gap:6px;}
  .photo-field__controls input[type=file]{font-size:12px;}

  /* History */
  .history-row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .history-row__date{font-weight:700;font-size:14px;}
  .history-row__meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;transition:opacity .15s ease;}
  .modal-overlay[hidden]{display:none;}
  @media(min-width:640px){.modal-overlay{align-items:center;}}
  .modal{background:#fff;border-radius:14px 14px 0 0;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;}
  @media(min-width:640px){.modal{border-radius:14px;}}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--primary);}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .form-row input[type=text],.form-row input[type=number],.form-row select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;
  }
  .radio-group{display:flex;gap:16px;}
  .radio-group label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap;}

  .order-text{white-space:pre-wrap;font-size:13px;line-height:1.7;background:var(--surface-alt);border-radius:var(--radius-sm);padding:12px;max-height:40vh;overflow-y:auto;}

  .toast{
    position:fixed;left:50%;bottom:calc(var(--dock-h,0px) + 12px);transform:translateX(-50%);background:var(--primary);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }

  .backup-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .backup-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .app-footer{text-align:center;font-size:11px;color:var(--ink-soft);padding:16px;}

  @media(prefers-reduced-motion:reduce){
    .item-row,.modal-overlay,.stack-card,.stack-card.is-leaving,.stack-card__shade{transition:none;}
    .stack-card__result{animation:none;}
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="app-header__top">
      <div class="app-title-wrap">
        <h1 class="app-title"><span class="app-title__mark">✓</span>物品チェック</h1>
        <div class="room-switch" role="group" aria-label="管理先の切り替え">
          <button type="button" class="room-btn is-active" data-room="me">ME室</button>
          <button type="button" class="room-btn" data-room="cath">カテ室</button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" aria-selected="true" data-tab="check" type="button">チェック</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="master" type="button">マスタ管理</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="history" type="button">履歴</button>
      </div>
    </div>
    <div class="app-header__meta" id="checkMetaBar">
      <label class="field-inline"><span>実施日</span><input type="date" id="checkDate" /></label>
      <label class="field-inline"><span>担当者</span><select id="checkStaff"></select></label>
    </div>
    <button type="button" class="meta-summary" id="metaSummary" aria-label="実施日と担当者を変更する"></button>
  </header>

  <main>
    <section id="view-check" class="view">
      <div class="check-mode-bar">
        <span id="stackInfo" class="check-mode-bar__info"></span>
      </div>
      <div id="stackModeWrap">
        <div id="stackArea" class="stack-area"></div>
      </div>
      <div id="listModeWrap" hidden>
        <input type="search" id="checkSearch" class="search-row" placeholder="物品名・コードで絞り込み" />
        <div id="checkList" class="check-list"></div>
      </div>
    </section>

    <section id="view-master" class="view" hidden>
      <div class="master-block">
        <h2>設置場所</h2>
        <div id="locationList" class="location-list"></div>
        <form id="locationForm" class="inline-form">
          <input type="text" id="newLocationName" placeholder="新しい設置場所名" required />
          <button type="submit">追加</button>
        </form>
      </div>
      <div class="master-block">
        <h2>担当者</h2>
        <div id="staffMasterList" class="location-list"></div>
        <form id="staffForm" class="inline-form">
          <input type="text" id="newStaffName" placeholder="新しい担当者名" required />
          <button type="submit">追加</button>
        </form>
      </div>
      <div class="master-block">
        <div class="master-block__head">
          <h2>物品一覧</h2>
          <button type="button" id="addItemBtn" class="btn btn--primary">物品を追加</button>
        </div>
        <div class="master-hint">行を長押しして、上下にドラッグで並べ替え(絞り込み中は不可)</div>
        <input type="search" id="masterSearch" class="search-row" placeholder="物品名・コードで検索" />
        <div id="itemTable" class="item-table"></div>
      </div>
      <div class="master-block">
        <h2>データの引き継ぎ・バックアップ</h2>
        <p class="backup-note">ME室・カテ室の設置場所・物品・担当者・写真・履歴をまとめて1つのファイルに保存できます。別の端末や別のURLへ移すときに使います。</p>
        <div class="backup-actions">
          <button type="button" id="exportBtn" class="btn btn--primary">データを書き出す</button>
          <button type="button" id="importBtn" class="btn btn--ghost">データを読み込む</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden />
        </div>
      </div>
    </section>

    <section id="view-history" class="view" hidden>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <div class="dock" id="checkStickyBar">
    <div class="keypad" id="keypad" role="group" aria-label="実数入力パッド">
      <button type="button" class="keypad__key" data-key="1">1</button>
      <button type="button" class="keypad__key" data-key="2">2</button>
      <button type="button" class="keypad__key" data-key="3">3</button>
      <button type="button" class="keypad__key" data-key="4">4</button>
      <button type="button" class="keypad__key" data-key="5">5</button>
      <button type="button" class="keypad__key" data-key="6">6</button>
      <button type="button" class="keypad__key" data-key="7">7</button>
      <button type="button" class="keypad__key" data-key="8">8</button>
      <button type="button" class="keypad__key" data-key="9">9</button>
      <button type="button" class="keypad__key keypad__key--back" data-key="BACK">戻る</button>
      <button type="button" class="keypad__key" data-key="0">0</button>
      <button type="button" class="keypad__key keypad__key--sufficient" data-key="SUFFICIENT">十分</button>
    </div>
    <div class="sticky-bar">
      <span id="checkProgress" class="progress-text"></span>
      <div class="sticky-bar__actions">
        <button type="button" id="showOrderListBtn" class="btn btn--ghost">発注リストを見る</button>
        <button type="button" id="modeToggleBtn" class="btn btn--ghost">一覧で見る</button>
        <button type="button" id="recordBtn" class="btn btn--accent" hidden>記録する</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalContent"></div>
  </div>

  <div class="toast" id="toast" hidden aria-live="polite"></div>

  <footer class="app-footer">物品チェック v4.8 ・ データは端末内(このブラウザ)に保存されます</footer>

<script>
  var STORAGE_KEY = 'goodsCheck_v1';
  var STACK_RANKS = [
    {top:0, scale:1, opacity:1, z:40, shade:0},
    {top:30, scale:0.94, opacity:1, z:30, shade:0.04},
    {top:60, scale:0.88, opacity:1, z:20, shade:0.08},
    {top:90, scale:0.82, opacity:0, z:10, shade:0.08}
  ];

  function uid(){
    return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
  function todayStr(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(s){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s];
    });
  }
  function statusClass(state){
    if(state === 'order') return 'is-order';
    if(state === 'check') return 'is-check';
    if(state === 'ok' || state === 'sufficient') return 'is-ok';
    return '';
  }
  function compressImage(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{ cb(canvas.toDataURL('image/jpeg', quality)); }catch(err){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function defaultState(){
    return {
      meta:{version:'3.4'},
      locations:[],
      items:[],
      records:[],
      staffHistory:[],
      staff:[],
      draft:{date:todayStr(), staff:'', entries:{}, checkMode:'stack'}
    };
  }

  // 担当者マスタ: staff配列があればそれを使い、無ければ過去の履歴・記録から自動で作る
  function normalizeStaff(parsed){
    var out = [], seen = {};
    function add(name, id){
      name = String(name == null ? '' : name).trim();
      if(!name || seen[name]) return;
      seen[name] = true;
      out.push({ id: id || uid(), name: name });
    }
    if(parsed && Array.isArray(parsed.staff)){
      parsed.staff.forEach(function(x){
        if(x && typeof x === 'object') add(x.name, x.id); else add(x);
      });
    } else if(parsed){
      (Array.isArray(parsed.staffHistory) ? parsed.staffHistory : []).forEach(function(n){ add(n); });
      (Array.isArray(parsed.records) ? parsed.records : []).forEach(function(r){ if(r) add(r.staff); });
    }
    return out;
  }

  function normalizeState(parsed){
    try{
      if(!parsed) return defaultState();
      var draft = (parsed.draft && typeof parsed.draft === 'object') ? parsed.draft : {date:todayStr(), staff:'', entries:{}, checkMode:'stack'};
      if(!draft.checkMode) draft.checkMode = 'stack';
      if(!draft.entries || typeof draft.entries !== 'object') draft.entries = {};
      return Object.assign(defaultState(), parsed, {
        locations: Array.isArray(parsed.locations) ? parsed.locations : [],
        items: Array.isArray(parsed.items) ? parsed.items : [],
        records: Array.isArray(parsed.records) ? parsed.records : [],
        staffHistory: Array.isArray(parsed.staffHistory) ? parsed.staffHistory : [],
        staff: normalizeStaff(parsed),
        draft: draft
      });
    }catch(e){
      console.error('state load failed', e);
      return defaultState();
    }
  }

  var ROOMS = { me:'ME室', cath:'カテ室' };
  var store = { meta:{version:'4.7'}, currentRoom:'me', rooms:{ me:defaultState(), cath:defaultState() } };
  var state = store.rooms.me;
  var storageReady = false;
  var useIdb = true;
  var idbDb = null;
  var saveErrShown = false;
  var currentTab = 'check';
  var toastTimer = null;
  var stackNodes = {};
  var currentStackLocationId = null;
  var currentStackQueueIds = [];
  var activeEntryId = null;
  var answerHistory = [];
  var dayResetHappened = false;

  function checkDayReset(){
    var today = todayStr();
    if(state.draft.date && state.draft.date !== today){
      var hadData = Object.keys(state.draft.entries || {}).length > 0;
      state.draft = { date: today, staff: state.draft.staff || '', entries:{}, checkMode: state.draft.checkMode || 'stack' };
      dayResetHappened = hadData;
    }
  }

  window.addEventListener('error', function(e){
    var banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B3402A;color:#fff;padding:8px 12px;font-size:12px;z-index:999;';
    banner.textContent = 'エラーが発生しました: ' + e.message;
    document.body.appendChild(banner);
  });

  /* ---------- Storage (IndexedDB, falls back to localStorage) ---------- */
  function idbOpen(){
    return new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error('no idb')); return; }
      var req = indexedDB.open('goodsCheckDB', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('kv'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error('idb open failed')); };
      req.onblocked = function(){ reject(new Error('idb blocked')); };
    });
  }
  function idbGet(db, key){
    return new Promise(function(resolve, reject){
      var tx = db.transaction('kv', 'readonly');
      var rq = tx.objectStore('kv').get(key);
      rq.onsuccess = function(){ resolve(rq.result); };
      rq.onerror = function(){ reject(rq.error); };
    });
  }
  function idbPut(db, key, value){
    return new Promise(function(resolve, reject){
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error || new Error('aborted')); };
    });
  }
  function reportSaveError(e){
    console.error('save failed', e);
    if(saveErrShown) return;
    saveErrShown = true;
    alert('保存に失敗しました。端末の空き容量やブラウザの設定を確認してください。');
    setTimeout(function(){ saveErrShown = false; }, 5000);
  }
  function saveState(){
    if(!storageReady) return;
    if(useIdb && idbDb){
      idbPut(idbDb, 'state', store).catch(reportSaveError);
      return;
    }
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }catch(e){
      reportSaveError(e);
    }
  }

  function boot(){
    var migrated = false;
    function readLocal(){
      try{
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }
    idbOpen().then(function(db){
      idbDb = db;
      return idbGet(db, 'state');
    }).then(function(saved){
      if(!saved){
        saved = readLocal();
        if(saved) migrated = true;
      }
      return saved;
    }).catch(function(err){
      console.error('idb unavailable, using localStorage', err);
      useIdb = false;
      return readLocal();
    }).then(function(saved){
      var needSave = false;
      if(saved && saved.rooms && typeof saved.rooms === 'object'){
        store = {
          meta:{version:'4.7'},
          currentRoom: ROOMS[saved.currentRoom] ? saved.currentRoom : 'me',
          rooms:{ me: normalizeState(saved.rooms.me), cath: normalizeState(saved.rooms.cath) }
        };
      } else {
        // 旧形式(1管理先のみ)→ ME室へ移行。カテ室は空から開始
        store = { meta:{version:'4.7'}, currentRoom:'me', rooms:{ me: normalizeState(saved), cath: defaultState() } };
        needSave = true;
      }
      var q = '';
      try{ q = new URLSearchParams(location.search).get('room') || ''; }catch(e){}
      if(ROOMS[q] && q !== store.currentRoom){ store.currentRoom = q; needSave = true; }
      state = store.rooms[store.currentRoom];
      storageReady = true;
      checkDayReset();
      applyRoomUI();
      if(needSave || dayResetHappened || migrated || !saved || !Array.isArray(state.staff)) saveState();
      setTab('check');
      if(dayResetHappened) showToast('日付が変わったため入力内容をリセットしました');
      try{
        if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
      }catch(e){}
    });
  }

  function applyRoomUI(){
    var r = store.currentRoom;
    document.body.setAttribute('data-room', r);
    document.querySelectorAll('.room-btn').forEach(function(b){
      var on = b.dataset.room === r;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var title = '物品チェック(' + ROOMS[r] + ')';
    document.title = title;
    var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if(m) m.setAttribute('content', title);
    var tc = document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute('content', r === 'cath' ? '#23466F' : '#2C4A47');
  }
  function switchRoom(room){
    if(!ROOMS[room] || room === store.currentRoom || !storageReady) return;
    store.currentRoom = room;
    state = store.rooms[room];
    dayResetHappened = false;
    checkDayReset();
    activeEntryId = null;
    answerHistory = [];
    metaOpen = false;
    document.getElementById('checkSearch').value = '';
    document.getElementById('masterSearch').value = '';
    applyRoomUI();
    saveState();
    setTab(currentTab);
    window.scrollTo(0, 0);
    showToast(ROOMS[room] + 'に切り替えました' + (dayResetHappened ? '(日付が変わったため入力内容をリセット)' : ''));
  }
  document.querySelectorAll('.room-btn').forEach(function(b){
    b.addEventListener('click', function(){ switchRoom(b.dataset.room); });
  });

  function getLocationName(locId){
    if(locId === '__none__') return '未分類';
    var loc = state.locations.find(function(l){ return l.id === locId; });
    return loc ? loc.name : '未分類';
  }

  function getLastRecordedValue(itemId){
    if(state.records.length === 0) return undefined;
    return state.records[0].entries[itemId];
  }
  function prevText(item){
    var v = getLastRecordedValue(item.id);
    if(v === undefined) return '';
    if(v === 'SUFFICIENT') return '前回:十分';
    return '前回:' + v + (item.unit || '');
  }
  function valueText(item, qtyRaw){
    if(qtyRaw === undefined || qtyRaw === '') return '';
    if(qtyRaw === 'SUFFICIENT') return '十分';
    return qtyRaw + (item.unit || '');
  }

  function itemStatus(item, qtyRaw){
    if(qtyRaw === '' || qtyRaw === undefined || qtyRaw === null) return {state:'empty'};
    if(qtyRaw === 'SUFFICIENT') return {state:'sufficient', label:'十分'};
    var qty = Number(qtyRaw);
    if(Number.isNaN(qty)) return {state:'empty'};
    if(item.category === 'spd'){
      var threshold = Number(item.spdCheckQty) || 0;
      if(qty < threshold) return {state:'check', label:'要確認'};
      return {state:'ok', label:'✓'};
    } else {
      var std = Number(item.standardQty) || 0;
      var orderQty = Math.max(std - qty, 0);
      if(orderQty > 0) return {state:'order', label:'発注 ' + orderQty, orderQty:orderQty};
      return {state:'ok', label:'✓'};
    }
  }

  /* ---------- Tabs ---------- */
  function setTab(tab){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(function(btn){
      var active = btn.dataset.tab === tab;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    document.getElementById('view-check').hidden = tab !== 'check';
    document.getElementById('view-master').hidden = tab !== 'master';
    document.getElementById('view-history').hidden = tab !== 'history';
    updateMetaBar();
    document.getElementById('checkStickyBar').style.display = tab === 'check' ? 'block' : 'none';
    updateDockHeight();
    if(tab === 'check') renderCheck();
    if(tab === 'master') renderMaster();
    if(tab === 'history') renderHistory();
  }
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){ setTab(btn.dataset.tab); });
  });

  /* ---------- Check tab dispatcher ---------- */
  function renderCheck(){
    document.getElementById('checkDate').value = state.draft.date || todayStr();
    document.getElementById('checkStaff').value = state.draft.staff || '';
    renderStaffList();
    updateMetaBar();
    var mode = state.draft.checkMode || 'stack';
    document.getElementById('stackModeWrap').hidden = mode !== 'stack';
    document.getElementById('listModeWrap').hidden = mode !== 'list';
    document.getElementById('modeToggleBtn').textContent = mode === 'stack' ? '一覧で見る' : 'スタックで確認';
    if(mode === 'stack'){
      renderCheckStack();
    } else {
      renderCheckListMode();
    }
    updateProgress();
  }

  document.getElementById('modeToggleBtn').addEventListener('click', function(){
    state.draft.checkMode = (state.draft.checkMode === 'list') ? 'stack' : 'list';
    saveState();
    renderCheck();
  });

  function renderStaffList(){
    var sel = document.getElementById('checkStaff');
    var cur = state.draft.staff || '';
    var names = state.staff.map(function(x){ return x.name; });
    if(cur && names.indexOf(cur) === -1) names.push(cur);
    if(names.length === 0){
      sel.innerHTML = '<option value="">未登録(マスタ管理で追加)</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = '<option value="">選択してください</option>' + names.map(function(n){
      return '<option value="' + escapeHtml(n) + '"' + (n === cur ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
    }).join('');
    sel.value = cur;
  }

  function updateProgress(){
    var total = state.items.length;
    var filled = state.items.filter(function(it){
      var v = state.draft.entries[it.id];
      return v !== undefined && v !== '';
    }).length;
    document.getElementById('checkProgress').textContent = total ? ('入力済み ' + filled + '/' + total) : '';
    document.getElementById('recordBtn').hidden = !(total > 0 && filled === total);
    updateDockHeight();
  }

  /* ---------- Stack mode ---------- */
  function getActiveLocationQueue(){
    // マスタ物品一覧の並び順どおりに進める。
    // 未入力の先頭物品の設置場所を現在地とし、同じ設置場所が続く間を1つのスタックにする。
    function pending(it){
      var v = state.draft.entries[it.id];
      return v === undefined || v === '';
    }
    var startIdx = -1;
    for(var i=0;i<state.items.length;i++){
      if(pending(state.items[i])){ startIdx = i; break; }
    }
    if(startIdx === -1) return null;
    var locId = state.items[startIdx].locationId || '__none__';
    var queue = [];
    for(var j=startIdx;j<state.items.length;j++){
      var it = state.items[j];
      if(!pending(it)) continue;
      if((it.locationId || '__none__') !== locId) break;
      queue.push(it);
    }
    return {locationId:locId, locationName:getLocationName(locId), queueItems:queue};
  }

  function buildStackNode(item){
    var outer = document.createElement('div');
    outer.className = 'stack-card';
    var targetHtml;
    if(item.category === 'spd'){
      targetHtml = '確認用 ' + (item.spdCheckQty||0) + escapeHtml(item.unit||'') + ' ／SPD定数 ' + (item.spdSystemQty||0) + escapeHtml(item.unit||'');
    } else {
      targetHtml = '定数 ' + (item.standardQty||0) + escapeHtml(item.unit||'');
    }
    if(item.category === 'spd') targetHtml = '<span class="tag tag--spd" style="margin-right:4px;">SPD管理</span>' + targetHtml;
    if(item.note) targetHtml += ' <span class="tag tag--note">' + escapeHtml(item.note) + '</span>';
    var photoHtml = item.photo ? '<img src="' + item.photo + '" alt="">' : '';
    outer.innerHTML =
      '<div class="stack-card__inner">' +
        '<div class="stack-card__photo">' + photoHtml + '</div>' +
        '<div class="stack-card__body">' +
          '<div class="stack-card__name">' + escapeHtml(item.name) + '</div>' +
          (item.spec ? '<div class="stack-card__spec">' + escapeHtml(item.spec) + '</div>' : '') +
          '<div class="stack-card__target">' + targetHtml + '</div>' +
          (prevText(item) ? '<div class="stack-card__prev">' + escapeHtml(prevText(item)) + '</div>' : '') +
        '</div>' +
        '<div class="stack-card__shade"></div>' +
      '</div>';
    return outer;
  }

  function layoutStack(queue){
    queue.forEach(function(id, idx){
      var node = stackNodes[id];
      if(!node) return;
      var s = STACK_RANKS[idx] || STACK_RANKS[STACK_RANKS.length - 1];
      node.style.transform = 'translateY(' + s.top + 'px) scale(' + s.scale + ')';
      node.style.opacity = s.opacity;
      node.style.zIndex = s.z;
      var shade = node.querySelector('.stack-card__shade');
      if(shade) shade.style.opacity = s.shade;
      var inner = node.querySelector('.stack-card__inner');
      inner.classList.toggle('is-front', idx === 0);
      node.dataset.front = idx === 0 ? '1' : '0';
    });
  }

  function updateStackInfoForCurrentLocation(){
    var infoEl = document.getElementById('stackInfo');
    if(!currentStackLocationId){ infoEl.textContent = ''; return; }
    var totalInLoc = state.items.filter(function(it){ return (it.locationId || '__none__') === currentStackLocationId; }).length;
    var remaining = currentStackQueueIds.length;
    infoEl.innerHTML = '<strong>' + escapeHtml(getLocationName(currentStackLocationId)) + '</strong> ／ 残り ' + remaining + '/' + totalInLoc;
  }

  function renderCheckStack(){
    var area = document.getElementById('stackArea');
    area.innerHTML = '';
    stackNodes = {};
    currentStackQueueIds = [];
    currentStackLocationId = null;

    if(state.items.length === 0){
      area.innerHTML = '<div class="stack-empty">まだ物品が登録されていません。「マスタ管理」から登録してください。</div>';
      document.getElementById('stackInfo').textContent = '';
      return;
    }
    var active = getActiveLocationQueue();
    if(!active){
      area.innerHTML = '<div class="stack-empty">すべての物品を確認しました。「発注リストを見る」または「記録する」に進んでください。</div>';
      document.getElementById('stackInfo').textContent = '';
      return;
    }
    currentStackLocationId = active.locationId;
    currentStackQueueIds = active.queueItems.map(function(it){ return it.id; });
    active.queueItems.forEach(function(item){
      var node = buildStackNode(item);
      area.appendChild(node);
      stackNodes[item.id] = node;
    });
    layoutStack(currentStackQueueIds);
    updateStackInfoForCurrentLocation();
  }

  var stackLeaving = 0;
  function showStackResult(node, item, value){
    if(!item) return;
    var st = itemStatus(item, value);
    var cls = statusClass(st.state) || 'is-ok';
    var val = valueText(item, value);
    var stateText = st.state === 'order' ? st.label : (st.state === 'check' ? '要確認' : 'OK ✓');
    var res = document.createElement('div');
    res.className = 'stack-card__result ' + cls;
    res.innerHTML = '<span class="stack-card__result-val">' + escapeHtml(val) + '</span>' +
                    '<span class="stack-card__result-state">' + escapeHtml(stateText) + '</span>';
    var inner = node.querySelector('.stack-card__inner');
    inner.appendChild(res);
    inner.classList.add('res-' + cls.replace('is-', ''));
  }

  function completeStackItem(itemId, value){
    state.draft.entries[itemId] = value;
    saveState();

    var item = state.items.find(function(it){ return it.id === itemId; });
    var node = stackNodes[itemId];
    currentStackQueueIds = currentStackQueueIds.filter(function(id){ return id !== itemId; });
    stackLeaving++;
    if(node){
      node.dataset.front = '0';
      node.style.zIndex = 50;
      showStackResult(node, item, value);
    }
    // 後ろのカードはすぐにせり上がる(入力は待たせない)
    layoutStack(currentStackQueueIds);
    updateStackInfoForCurrentLocation();
    updateProgress();

    // 結果を少し見せてから、上へ飛ばして消す
    setTimeout(function(){
      if(!node) return;
      node.classList.add('is-leaving');
      node.style.transform = 'translateY(-230px) scale(1.03)';
      node.style.opacity = '0';
    }, 250);
    setTimeout(function(){
      if(node && node.parentNode) node.parentNode.removeChild(node);
      if(stackNodes[itemId] === node) delete stackNodes[itemId];
      stackLeaving = Math.max(0, stackLeaving - 1);
      if(stackLeaving === 0 && currentStackQueueIds.length === 0){
        renderCheckStack();
        updateProgress();
      }
    }, 790);
  }

  /* ---------- List mode ---------- */
  function renderItemRow(item){
    var qtyRaw = state.draft.entries[item.id];
    var status = itemStatus(item, qtyRaw);
    var rowClass = statusClass(status.state);
    var stdLabel = item.category === 'spd' ? '確認用' : '定数';
    var stdValue = item.category === 'spd' ? (item.spdCheckQty || 0) : (item.standardQty || 0);
    var tags = [];
    if(item.category === 'spd') tags.push('<span class="tag tag--spd">SPD管理</span>');
    if(item.category === 'spd') tags.push('<span class="tag">SPD定数 ' + (item.spdSystemQty||0) + '</span>');
    if(item.shelf) tags.push('<span class="tag">棚 ' + escapeHtml(item.shelf) + '</span>');
    if(item.note) tags.push('<span class="tag tag--note">' + escapeHtml(item.note) + '</span>');

      '<button type="button" class="item-row__clear' + (vt ? '' : ' is-hidden') + '" data-action="clear-entry" data-id="' + item.id + '" aria-label="入力を取り消す">×</button>';
    return '' +
      '<div class="item-row ' + rowClass + (item.id === activeEntryId ? ' is-active' : '') + '" data-item-id="' + item.id + '">' +
        '<div class="item-row__photo">' + photoHtml + '</div>' +
        '<div class="item-row__main">' +
          '<div class="item-row__name">' + escapeHtml(item.name) + '</div>' +
          (item.spec ? '<div class="item-row__spec">' + escapeHtml(item.spec) + '</div>' : '') +
          (tags.length ? '<div class="item-row__tags">' + tags.join('') + '</div>' : '') +
        '</div>' +
        '<div class="item-row__std">' + stdLabel + '<br>' + stdValue + escapeHtml(item.unit || '') + '</div>' +
        inputArea +
        '<div class="item-row__status-wrap">' + statusHtml + '</div>' +

  function renderCheckListMode(){
    var listEl = document.getElementById('checkList');
    var search = (document.getElementById('checkSearch').value || '').trim().toLowerCase();

    if(state.items.length === 0){
      listEl.innerHTML = '<div class="empty-state"><p>まだ物品が登録されていません。</p><button type="button" class="btn btn--primary" data-action="goto-master">マスタ管理で登録する</button></div>';
      return;
    }

    if(!activeEntryId || !state.items.some(function(it){ return it.id === activeEntryId; })){
      activeEntryId = firstPendingId();
    }
    var itemsByLoc = {};
    state.items.forEach(function(it){
      var key = it.locationId || '__none__';
      if(!itemsByLoc[key]) itemsByLoc[key] = [];
      itemsByLoc[key].push(it);
    });

    function renderLocBlock(locId, locName){
      var items = itemsByLoc[locId] || [];
      if(search){
        items = items.filter(function(it){
          return (it.name || '').toLowerCase().indexOf(search) !== -1 ||
                 (it.code || '').toLowerCase().indexOf(search) !== -1 ||
                 (it.spec || '').toLowerCase().indexOf(search) !== -1;
        });
      }
      if(items.length === 0) return '';
      var filledCount = items.filter(function(it){
        var v = state.draft.entries[it.id];
        return v !== undefined && v !== '';
      }).length;
      var rows = items.map(renderItemRow).join('');
      return '<div class="location-section">' +
        '<div class="location-section__head"><span class="location-section__title">' + escapeHtml(locName) + '</span>' +
        '<span class="location-section__progress">' + filledCount + '/' + items.length + ' 入力済み</span></div>' +
        rows + '</div>';
    }

    var html = '';
    var locOrder = [];
    state.items.forEach(function(it){
      var k = it.locationId || '__none__';
      if(locOrder.indexOf(k) === -1) locOrder.push(k);
    });
    locOrder.forEach(function(k){ html += renderLocBlock(k, getLocationName(k)); });

    listEl.innerHTML = html || '<div class="empty-state"><p>該当する物品がありません。</p></div>';
  }

  function refreshItemRow(itemId){
    var item = state.items.find(function(it){ return it.id === itemId; });
    if(!item) return;
    var row = document.querySelector('.item-row[data-item-id="' + itemId + '"]');
    if(!row) return;
    var qtyRaw = state.draft.entries[itemId];
    var status = itemStatus(item, qtyRaw);
    row.classList.remove('is-ok','is-order','is-check');
    var cls = statusClass(status.state);
    if(cls) row.classList.add(cls);
    var statusWrap = row.querySelector('.item-row__status-wrap');
    statusWrap.innerHTML = status.state === 'empty' ? '' : '<span class="item-row__status ' + cls + '">' + status.label + '</span>';
    var valEl = row.querySelector('.item-row__val');
    if(valEl){
      var vt = valueText(item, qtyRaw);
      valEl.textContent = vt || prevText(item) || '未入力';
      valEl.classList.toggle('is-empty', !vt);
    }
    var clrEl = row.querySelector('.item-row__clear');
    if(clrEl) clrEl.classList.toggle('is-hidden', !valueText(item, qtyRaw));
    var section = row.closest('.location-section');
    if(section){
      var rows = section.querySelectorAll('.item-row');
      var filled = 0;
      rows.forEach(function(r){
        var id = r.dataset.itemId;
        var v = state.draft.entries[id];
        if(v !== undefined && v !== '') filled++;
      });
      var progEl = section.querySelector('.location-section__progress');
      if(progEl) progEl.textContent = filled + '/' + rows.length + ' 入力済み';
    }
  }

  /* ---------- Keypad (fixed numeric pad) ---------- */
  function isPending(it){
    var v = state.draft.entries[it.id];
    return v === undefined || v === '';
  }
  function firstPendingId(){
    for(var i=0;i<state.items.length;i++){ if(isPending(state.items[i])) return state.items[i].id; }
    return null;
  }
  function setActiveEntry(id, scroll){
    activeEntryId = id;
    document.querySelectorAll('.item-row.is-active').forEach(function(r){ r.classList.remove('is-active'); });
    var row = document.querySelector('.item-row[data-item-id="' + id + '"]');
    if(row){
      row.classList.add('is-active');
      if(scroll) row.scrollIntoView({block:'center', behavior:'smooth'});
    }
  }
  function advanceListActive(fromId){
    var idx = state.items.findIndex(function(it){ return it.id === fromId; });
    var next = null, i;
    for(i = idx + 1; i < state.items.length; i++){ if(isPending(state.items[i])){ next = state.items[i].id; break; } }
    if(!next){
      for(i = 0; i < idx; i++){ if(isPending(state.items[i])){ next = state.items[i].id; break; } }
    }
    if(next) setActiveEntry(next, true);
  }
  function modalIsOpen(){ return !document.getElementById('modalOverlay').hidden; }

  function enterValue(value){
    if(modalIsOpen() || currentTab !== 'check') return;
    if(state.draft.checkMode === 'list'){
      var id = activeEntryId;
      if(!id || !state.items.some(function(it){ return it.id === id; })) return;
      state.draft.entries[id] = value;
      answerHistory.push(id);
      saveState();
      refreshItemRow(id);
      updateProgress();
      advanceListActive(id);
    } else {
      var front = currentStackQueueIds[0];
      if(!front) return;
      answerHistory.push(front);
      completeStackItem(front, value);
    }
  }

  function undoLast(){
    if(modalIsOpen() || currentTab !== 'check') return;
    var id = null;
    while(answerHistory.length){
      var c = answerHistory.pop();
      if(state.draft.entries[c] !== undefined && state.draft.entries[c] !== '' && state.items.some(function(it){ return it.id === c; })){ id = c; break; }
    }
    if(!id){
      for(var i = state.items.length - 1; i >= 0; i--){
        var v = state.draft.entries[state.items[i].id];
        if(v !== undefined && v !== ''){ id = state.items[i].id; break; }
      }
    }
    if(!id){ showToast('戻せる入力がありません'); return; }
    delete state.draft.entries[id];
    saveState();
    activeEntryId = id;
    renderCheck();
    if(state.draft.checkMode === 'list') setActiveEntry(id, true);
    showToast('1つ戻しました');
  }

  document.getElementById('keypad').addEventListener('click', function(e){
    var btn = e.target.closest('[data-key]');
    if(!btn) return;
    var key = btn.dataset.key;
    if(key === 'BACK') undoLast();
    else enterValue(key);
  });
  // 物理キーボード(外付けなど)でも入力できるようにする
  document.addEventListener('keydown', function(e){
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(/^[0-9]$/.test(e.key)){ enterValue(e.key); e.preventDefault(); }
    else if(e.key === 'Backspace'){ undoLast(); e.preventDefault(); }
  });
  document.getElementById('checkList').addEventListener('click', function(e){

  var metaOpen = false;
  function formatMetaDate(d){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if(!m) return d || '';
    var w = ['日','月','火','水','木','金','土'][new Date(+m[1], +m[2]-1, +m[3]).getDay()];
    return m[2] + '/' + m[3] + '(' + w + ')';
  }

  /* ---------- Order list ---------- */
  function buildOrderText(entries, dateLabel){
    var byLoc = {};
    var checkNeeded = [];
    state.items.forEach(function(item){
      var qty = entries[item.id];
      if(qty === undefined) return;
      var status = itemStatus(item, String(qty));
      var locName = getLocationName(item.locationId || '__none__');
      if(item.category === 'spd'){
        if(status.state === 'check'){
          checkNeeded.push(locName + ' / ' + item.name + (item.spec ? '(' + item.spec + ')' : '') + '  実数' + qty + ' < 確認用' + item.spdCheckQty + '(SPD定数' + (item.spdSystemQty||0) + ')');
        }
      } else if(status.state === 'order'){
        if(!byLoc[locName]) byLoc[locName] = [];
        byLoc[locName].push(item.name + (item.spec ? '(' + item.spec + ')' : '') + '  発注 ' + status.orderQty + (item.unit || ''));
      }
    });
    var text = '【発注リスト】' + dateLabel + '\n';
    var locNames = Object.keys(byLoc);
    if(locNames.length === 0){
      text += '不足はありません。\n';
    } else {
      locNames.forEach(function(loc){
        text += '\n' + loc + '\n';
        byLoc[loc].forEach(function(line){ text += '　' + line + '\n'; });
      });
    }
    if(checkNeeded.length){
      text += '\n【要確認(SPD管理品)】\n';
      checkNeeded.forEach(function(line){ text += '　' + line + '\n'; });
    }
    return text;
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('コピーしました');
      }).catch(function(){ fallbackCopyPrompt(text); });
    } else {
      fallbackCopyPrompt(text);
    }
  }
  function fallbackCopyPrompt(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      showToast('コピーしました');
    }catch(e){
      alert('コピーに失敗しました。テキストを選択して手動でコピーしてください。');
    }
    document.body.removeChild(ta);
  }

      var v = state.draft.entries[id];

  /* ---------- Record ---------- */
  document.getElementById('recordBtn').addEventListener('click', function(){
    if(state.items.length === 0){
      alert('物品が登録されていません。先にマスタ管理で登録してください。');
      return;
    }
    var staff = (state.draft.staff || '').trim();
    if(!staff){
      alert(state.staff.length === 0 ? 'マスタ管理で担当者を登録してください。' : '担当者を選択してください。');
      document.getElementById('checkStaff').focus();
      return;
    }
    var date = state.draft.date || todayStr();
    var total = state.items.length;
    var filledIds = Object.keys(state.draft.entries).filter(function(id){ return state.draft.entries[id] !== ''; });
    if(filledIds.length < total){
      alert('未入力の物品があります。すべて入力してから記録してください。');
      return;
    }
    var entries = {};
    filledIds.forEach(function(id){
      var v = state.draft.entries[id];
      entries[id] = (v === 'SUFFICIENT') ? 'SUFFICIENT' : Number(v);
    });
    var record = { id: uid(), date: date, staff: staff, entries: entries, createdAt: new Date().toISOString() };
    state.records.unshift(record);
    if(state.staffHistory.indexOf(staff) === -1) state.staffHistory.push(staff);
    state.draft = { date: todayStr(), staff: staff, entries:{}, checkMode: state.draft.checkMode || 'stack' };
    answerHistory = [];
    activeEntryId = null;
    saveState();
    renderCheck();
    showToast('記録しました(' + date + ' 担当:' + staff + ')');
  });

        '</div>' +
        '<div class="form-row" id="spdCheckQtyRow" style="' + (isSpd ? '' : 'display:none;') + '">' +
          '<label>ME室 現物確認用の定数</label><input type="number" name="spdCheckQty" min="0" value="' + (item.spdCheckQty || 0) + '" />' +
        '</div>' +
        '<div class="form-row"><label>備考</label><input type="text" name="note" value="' + escapeHtml(item.note) + '" placeholder="期限確認 など" /></div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn btn--ghost" data-action="close-modal">キャンセル</button>' +
          '<button type="submit" class="btn btn--primary">保存</button>' +
        '</div>' +
      '</form>'
    );

    var form = document.getElementById('itemForm');
    var photoPreview = document.getElementById('photoPreview');
    var photoInput = document.getElementById('photoInput');
    var removePhotoBtn = document.getElementById('removePhotoBtn');
    photoInput.addEventListener('change', function(){
      var file = photoInput.files && photoInput.files[0];
      if(!file) return;
      compressImage(file, 900, 0.72, function(dataUrl){
        if(dataUrl){
          pendingPhoto = dataUrl;
          photoPreview.innerHTML = '<img src="' + dataUrl + '" alt="">';
          removePhotoBtn.style.display = '';
        } else {
          alert('写真の読み込みに失敗しました。');
        }
      });
    });
    removePhotoBtn.addEventListener('click', function(){
      pendingPhoto = null;
      photoPreview.innerHTML = '';
      removePhotoBtn.style.display = 'none';
      photoInput.value = '';
    });

    var normalQtyRow = document.getElementById('normalQtyRow');
    var spdQtyRow = document.getElementById('spdQtyRow');
    var spdCheckQtyRow = document.getElementById('spdCheckQtyRow');
    form.querySelectorAll('input[name="category"]').forEach(function(r){
      r.addEventListener('change', function(){
        var spdSel = form.category.value === 'spd';
        normalQtyRow.style.display = spdSel ? 'none' : '';
        spdQtyRow.style.display = spdSel ? '' : 'none';
        spdCheckQtyRow.style.display = spdSel ? '' : 'none';
      });
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var fd = new FormData(form);
      var category = fd.get('category');
      var name = fd.get('name').trim();
      if(!name){ alert('物品名を入力してください。'); return; }
      var standardQty = Number(fd.get('standardQty')) || 0;
      var spdSystemQty = Number(fd.get('spdSystemQty')) || 0;
      var spdCheckQty = Number(fd.get('spdCheckQty')) || 0;
      var payload = {
        locationId: fd.get('locationId'),
        name: name,
        spec: fd.get('spec').trim(),
        shelf: fd.get('shelf').trim(),
        code: fd.get('code').trim(),
        unit: fd.get('unit').trim() || '個',
        category: category,
        standardQty: category === 'normal' ? standardQty : 0,
        spdSystemQty: category === 'spd' ? spdSystemQty : 0,
        spdCheckQty: category === 'spd' ? spdCheckQty : 0,
        note: fd.get('note').trim(),
        photo: pendingPhoto || ''
      };
      if(editing){
        Object.assign(item, payload);
      } else {
        state.items.push(Object.assign({ id: uid() }, payload));
      }
      saveState();
      closeModal();
      renderMaster();
      renderCheck();
    });
  }

  function renderStaffMaster(){
    var el = document.getElementById('staffMasterList');
    if(state.staff.length === 0){
      el.innerHTML = '<p style="color:var(--ink-soft);font-size:13px;">まだ担当者がいません。下記から追加してください。</p>';
      return;
    }
    el.innerHTML = state.staff.map(function(x){
      return '<span class="location-chip">' + escapeHtml(x.name) +
        '<button type="button" data-action="delete-staff" data-id="' + x.id + '" title="削除">×</button></span>';
    }).join('');
  }
  document.getElementById('staffForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = document.getElementById('newStaffName');
    var name = input.value.trim();
    if(!name) return;
    if(state.staff.some(function(x){ return x.name === name; })){
      alert('同じ名前の担当者がすでにいます。');
      return;
    }
    state.staff.push({ id: uid(), name: name });
    input.value = '';
    saveState();
    renderStaffMaster();
    renderStaffList();
  });

  function renderMaster(){
    renderLocationList();
    renderStaffMaster();
    renderItemTable();
  }

  /* ---------- History ---------- */
  function renderHistory(){
    var el = document.getElementById('historyList');
    if(state.records.length === 0){
      el.innerHTML = '<div class="empty-state"><p>まだ記録がありません。</p></div>';
      return;
    }
    el.innerHTML = state.records.map(function(r){
      var total = Object.keys(r.entries).length;
      var orderCount = 0, checkCount = 0;
      Object.keys(r.entries).forEach(function(id){
        var item = state.items.find(function(it){ return it.id === id; });
        if(!item) return;
        var status = itemStatus(item, String(r.entries[id]));
        if(status.state === 'order') orderCount++;
        if(status.state === 'check') checkCount++;
      });
      return '<div class="history-row" data-action="view-record" data-id="' + r.id + '">' +
        '<div><div class="history-row__date">' + escapeHtml(r.date) + '</div>' +
        '<div class="history-row__meta">担当: ' + escapeHtml(r.staff) + ' ／ 記録件数 ' + total + '件' +
        (orderCount ? ' ／ 発注 ' + orderCount + '件' : '') +
        (checkCount ? ' ／ 要確認 ' + checkCount + '件' : '') + '</div></div>' +
        '<span style="color:var(--ink-soft);font-size:18px;">›</span></div>';
    }).join('');
  }

  function openRecordDetail(recordId){
    var r = state.records.find(function(x){ return x.id === recordId; });
    if(!r) return;
    var text = buildOrderText(r.entries, r.date);
    var rows = Object.keys(r.entries).map(function(id){
      var item = state.items.find(function(it){ return it.id === id; });
      if(!item) return '';
      var status = itemStatus(item, String(r.entries[id]));
      var cls = statusClass(status.state);
      var statusHtml = status.state !== 'empty' ? ('<span class="item-row__status ' + cls + '">' + status.label + '</span>') : '';
      var displayVal = r.entries[id] === 'SUFFICIENT' ? '十分(目視)' : (r.entries[id] + escapeHtml(item.unit || ''));
      return '<div class="item-row ' + cls + '">' +
        '<div class="item-row__main"><div class="item-row__name">' + escapeHtml(item.name) + '</div>' +
        (item.spec ? '<div class="item-row__spec">' + escapeHtml(item.spec) + '</div>' : '') + '</div>' +
        '<div class="item-row__std">実数<br>' + displayVal + '</div>' +
        '<div class="item-row__status-wrap">' + statusHtml + '</div></div>';
    }).join('');
    openModal(
      '<h3>' + escapeHtml(r.date) + ' の記録(担当: ' + escapeHtml(r.staff) + ')</h3>' +
      '<div style="max-height:40vh;overflow-y:auto;margin-bottom:12px;">' + (rows || '<p>記録された物品がありません。</p>') + '</div>' +
      '<div class="modal-actions" style="justify-content:space-between;">' +
        '<button type="button" class="btn btn--danger" data-action="delete-record" data-id="' + r.id + '">この記録を削除</button>' +
        '<div style="display:flex;gap:8px;">' +
          '<button type="button" class="btn btn--ghost" data-action="close-modal">閉じる</button>' +
          '<button type="button" class="btn btn--accent" id="copyRecordOrderBtn">発注リストをコピー</button>' +
        '</div>' +
      '</div>'
    );
    document.getElementById('copyRecordOrderBtn').addEventListener('click', function(){ copyText(text); });
  }

  /* ---------- Modal ---------- */
  function openModal(html){
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').hidden = false;
  }
  function closeModal(){
    document.getElementById('modalOverlay').hidden = true;
    document.getElementById('modalContent').innerHTML = '';
  }
  // 入力欄でドラッグ開始→モーダル外で離した場合に閉じないよう、押下位置も確認する
  var overlayPressStartedOnOverlay = false;
  document.getElementById('modalOverlay').addEventListener('mousedown', function(e){
    overlayPressStartedOnOverlay = (e.target.id === 'modalOverlay');
  });
  document.getElementById('modalOverlay').addEventListener('touchstart', function(e){
    overlayPressStartedOnOverlay = (e.target.id === 'modalOverlay');
  }, {passive:true});
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target.id === 'modalOverlay' && overlayPressStartedOnOverlay) closeModal();
    overlayPressStartedOnOverlay = false;
  });

  /* ---------- Toast ---------- */
  function showToast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 2600);
  }

  /* ---------- Delegated actions ---------- */
  document.body.addEventListener('click', function(e){
    var closeBtn = e.target.closest('[data-action="close-modal"]');
    if(closeBtn){ closeModal(); return; }

    var gotoMaster = e.target.closest('[data-action="goto-master"]');
    if(gotoMaster){ setTab('master'); return; }

    var clearEntry = e.target.closest('[data-action="clear-entry"]');
    if(clearEntry){
      delete state.draft.entries[clearEntry.dataset.id];
      activeEntryId = clearEntry.dataset.id;
      saveState();
      renderCheckListMode();
      updateProgress();
      return;
    }

    var delLoc = e.target.closest('[data-action="delete-location"]');
    if(delLoc){
      var locId = delLoc.dataset.id;
      var inUse = state.items.some(function(it){ return it.locationId === locId; });
      if(inUse){ alert('この設置場所を使用している物品があります。先に物品の設置場所を変更するか削除してください。'); return; }
      if(confirm('この設置場所を削除しますか？')){
        state.locations = state.locations.filter(function(l){ return l.id !== locId; });
        saveState();
        renderMaster();
      }
      return;
    }

    var delStaff = e.target.closest('[data-action="delete-staff"]');
    if(delStaff){
      var target = state.staff.find(function(x){ return x.id === delStaff.dataset.id; });
      if(target && confirm('「' + target.name + '」を削除しますか？(過去の記録の担当者名は残ります)')){
        state.staff = state.staff.filter(function(x){ return x.id !== target.id; });
        if(state.draft.staff === target.name) state.draft.staff = '';
        saveState();
        renderStaffMaster();
        renderStaffList();
      }
      return;
    }

    var editItem = e.target.closest('[data-action="edit-item"]');
    if(editItem){ openItemForm(editItem.dataset.id); return; }

    var delItem = e.target.closest('[data-action="delete-item"]');
    if(delItem){
      if(confirm('この物品を削除しますか？')){
        state.items = state.items.filter(function(it){ return it.id !== delItem.dataset.id; });
        saveState();
        renderMaster();
        renderCheck();
      }
      return;
    }

    var viewRecord = e.target.closest('[data-action="view-record"]');
    if(viewRecord){ openRecordDetail(viewRecord.dataset.id); return; }

    var delRecord = e.target.closest('[data-action="delete-record"]');
    if(delRecord){
      if(confirm('この記録を削除しますか？(元に戻せません)')){
        state.records = state.records.filter(function(r){ return r.id !== delRecord.dataset.id; });
        saveState();
        closeModal();
        renderHistory();
      }
      return;
    }
  });

  /* ---------- Back-navigation guard ---------- */
  // 横スワイプ/ドラッグ等による意図しない「戻る」でページを離れないようにする
  try{
    history.pushState({guard:1}, '', location.href);
    window.addEventListener('popstate', function(){
      history.pushState({guard:1}, '', location.href);
    });
  }catch(e){}
  document.addEventListener('wheel', function(e){
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){
      var t = e.target;
      var scrollable = false;
      while(t && t !== document.body){
        if(t.scrollWidth > t.clientWidth && getComputedStyle(t).overflowX !== 'visible'){ scrollable = true; break; }
        t = t.parentNode;
      }
      if(!scrollable) e.preventDefault();
    }
  }, {passive:false});

  /* ---------- Drag reorder (long press) ---------- */
  (function(){
    var table = document.getElementById('itemTable');
    var HOLD_MS = 400, MOVE_TOL = 8;
    var st = null;

    function searchActive(){ return (document.getElementById('masterSearch').value || '').trim() !== ''; }
    function cleanup(){
      if(!st) return;
      clearTimeout(st.timer);
      if(st.raf) cancelAnimationFrame(st.raf);
      if(st.row){ st.row.classList.remove('is-dragging'); st.row.style.transform = ''; }
      if(st.line && st.line.parentNode) st.line.parentNode.removeChild(st.line);
      st = null;
    }
    function activate(){
      if(!st) return;
      st.active = true;
      var sy = window.scrollY;
      st.rects = Array.prototype.map.call(table.querySelectorAll('.item-table-row'), function(r){
        var b = r.getBoundingClientRect();
        return { id: r.dataset.id, top: b.top + sy, bottom: b.bottom + sy };
      });
      st.startPageY = st.startY + sy;
      st.row.classList.add('is-dragging');
      st.line = document.createElement('div');
      st.line.className = 'drop-line';
      table.appendChild(st.line);
      try{ st.row.setPointerCapture(st.pid); }catch(_){}
      try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){}
      update();
      tick();
    }
    function update(){
      if(!st || !st.active) return;
      var sy = window.scrollY;
      var dy = (st.lastY + sy) - st.startPageY;
      st.row.style.transform = 'translateY(' + dy + 'px)';
      var me = null, others = [];
      st.rects.forEach(function(r){ if(r.id === st.id) me = r; else others.push(r); });
      var center = (me.top + me.bottom) / 2 + dy;
      var before = null;
      for(var i = 0; i < others.length; i++){
        if(center < (others[i].top + others[i].bottom) / 2){ before = others[i]; break; }
      }
      st.target = before ? before.id : null;
      var tableTop = table.getBoundingClientRect().top + sy;
      var y = before ? before.top - 3 : (others.length ? others[others.length - 1].bottom + 3 : me.bottom);
      st.line.style.top = (y - tableTop) + 'px';
    }
    function tick(){
      if(!st || !st.active) return;
      var head = document.querySelector('.app-header');
      var top = (head ? head.offsetHeight : 0) + 30;
      var bottom = window.innerHeight - 50;
      var v = 0;
      if(st.lastY < top) v = -Math.min(18, (top - st.lastY) / 4 + 4);
      else if(st.lastY > bottom) v = Math.min(18, (st.lastY - bottom) / 4 + 4);
      if(v){ window.scrollBy(0, v); update(); }
      st.raf = requestAnimationFrame(tick);
    }

    table.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      var row = e.target.closest('.item-table-row');
      if(!row || e.target.closest('button')) return;
      if(searchActive()) return;
      cleanup();
      st = { row: row, id: row.dataset.id, pid: e.pointerId, startX: e.clientX, startY: e.clientY,
             lastY: e.clientY, active: false, target: null };
      st.timer = setTimeout(activate, HOLD_MS);
    });
    table.addEventListener('pointermove', function(e){
      if(!st || e.pointerId !== st.pid) return;
      if(!st.active){
        if(Math.abs(e.clientX - st.startX) > MOVE_TOL || Math.abs(e.clientY - st.startY) > MOVE_TOL) cleanup();
        return;
      }
      st.lastY = e.clientY;
      e.preventDefault();
      update();
    });
    function finish(e, commit){
      if(!st || e.pointerId !== st.pid) return;
      var did = st.active && commit;
      var id = st.id, target = st.target;
      cleanup();
      if(!did) return;
      var from = state.items.findIndex(function(it){ return it.id === id; });
      if(from === -1) return;
      var item = state.items.splice(from, 1)[0];
      var to = target ? state.items.findIndex(function(it){ return it.id === target; }) : state.items.length;
      if(to === -1) to = state.items.length;
      state.items.splice(to, 0, item);
      saveState();
      renderItemTable();
    }
    table.addEventListener('pointerup', function(e){ finish(e, true); });
    table.addEventListener('pointercancel', function(e){ finish(e, false); });
    document.addEventListener('touchmove', function(e){
      if(st && st.active && e.cancelable) e.preventDefault();
    }, { passive: false });
    table.addEventListener('contextmenu', function(e){ if(st) e.preventDefault(); });
  })();

  /* ---------- Backup / Restore ---------- */
  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(store)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'goods_check_backup_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    showToast('書き出しました(ME室 ' + store.rooms.me.items.length + '品目 / カテ室 ' + store.rooms.cath.items.length + '品目)');
  });
  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    var input = e.target;
    var file = input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(data && data.rooms && typeof data.rooms === 'object'){
          var nm = normalizeState(data.rooms.me), nc = normalizeState(data.rooms.cath);
          var m2 = '現在のデータをすべて上書きして読み込みますか？\nME室: 物品 ' + nm.items.length + '件 / 記録 ' + nm.records.length + '件\nカテ室: 物品 ' + nc.items.length + '件 / 記録 ' + nc.records.length + '件';
          if(!confirm(m2)){ input.value = ''; return; }
          store.rooms.me = nm; store.rooms.cath = nc;
          state = store.rooms[store.currentRoom];
          checkDayReset();
          saveState();
          setTab(currentTab);
          showToast('読み込みました(ME室・カテ室)');
          input.value = '';
          return;
        }
        if(!data || !Array.isArray(data.items) || !Array.isArray(data.locations)) throw new Error('形式が違います');
        var msg = '【' + ROOMS[store.currentRoom] + '】の現在のデータを上書きして読み込みますか？\n設置場所 ' + data.locations.length + '件 / 物品 ' + data.items.length + '件 / 記録 ' + (Array.isArray(data.records) ? data.records.length : 0) + '件';
        if(!confirm(msg)){ input.value = ''; return; }
        state.locations = data.locations;
        state.items = data.items;
        state.records = Array.isArray(data.records) ? data.records : [];
        state.staffHistory = Array.isArray(data.staffHistory) ? data.staffHistory : [];
        state.staff = normalizeStaff(data);
        saveState();
        renderMaster();
        renderCheck();
        showToast('読み込みました');
      }catch(err){
        alert('読み込みに失敗しました。書き出したファイルを選んでください。');
      }
      input.value = '';
    };
    reader.onerror = function(){ alert('ファイルを読み込めませんでした。'); input.value = ''; };
    reader.readAsText(file);
  });

  /* ---------- Init ---------- */
  boot();
</script>
</body>
